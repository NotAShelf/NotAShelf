<svg xmlns="http://www.w3.org/2000/svg" width="720" height="256" viewBox="0 0 720 256" role="img">
<title>Fortune</title>
<style>
:root { --paper: #141713; --ink: #ded6c3; --muted: #d0c9b8; --rule: #9f9987; --faint: #666a5b; }
@media (prefers-color-scheme: light) {
  :root { --paper: #f5eedf; --ink: #29271f; --muted: #645b4b; --rule: #8c7c60; --faint: #cbbd9f; }
}
</style>
<rect width="720" height="256" rx="9" fill="var(--paper)"/>
<rect x="7" y="7" width="706" height="242" rx="5" fill="none" stroke="var(--rule)" stroke-width="0.7"/>
<rect x="11" y="11" width="698" height="234" rx="3" fill="none" stroke="var(--faint)" stroke-width="0.5"/>
<text x="360" y="39" text-anchor="middle" fill="var(--ink)" font-family="Georgia, serif" font-size="24" font-variant="small-caps" letter-spacing="2">Fortune</text>
<path d="M28 55 H332 L360 48 L388 55 H692" fill="none" stroke="var(--rule)" stroke-width="0.6"/>
<g fill="var(--muted)" font-family="Georgia, 'Times New Roman', serif" font-size="16.5">
<text x="28" y="82">Spread: The Sun (upright) / Temperance (reversed) / Judgement (reversed).</text>
<text x="28" y="117">Root: Nixpkgs draws The Sun (upright), grounding the spread in nix Packages</text>
<text x="28" y="140">collection and NixOS. Crossing: sprint.nvim draws Temperance (reversed),</text>
<text x="28" y="163">putting pressure on robust command runner for Neovim. Path: batmon draws</text>
<text x="28" y="186">Judgement (reversed), turning the reading toward dead simple battery monitor</text>
<text x="28" y="209">in Go, with the ability to emit events on change.</text>
</g>
</svg>
