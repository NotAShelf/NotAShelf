<svg width="360" height="210" viewBox="0 0 360 210" xmlns="http://www.w3.org/2000/svg" role="img">
<title>GitHub profile statistics</title>
<style>
  text {
    font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif;
    letter-spacing: 0;
  }
  .title { fill: #f0f6fc; font-size: 16px; font-weight: 700; }
  .label { fill: #8b949e; font-size: 12px; font-weight: 600; }
  .value { fill: #c9d1d9; font-size: 13px; font-weight: 600; }
</style>
<rect x="5" y="5" width="350" height="200" rx="8" fill="#0d1117" stroke="#30363d" />
<text x="22" y="32" class="title">raf GitHub Statistics</text>
<line x1="22" y1="43" x2="338" y2="43" stroke="#30363d" />
<circle cx="27" cy="54" r="3" fill="#f78166" /><text x="38" y="58" class="label">Stars</text><text x="316" y="58" text-anchor="end" class="value">47,737</text>
<circle cx="27" cy="76" r="3" fill="#7ee787" /><text x="38" y="80" class="label">Forks</text><text x="316" y="80" text-anchor="end" class="value">2,653</text>
<circle cx="27" cy="98" r="3" fill="#f78166" /><text x="38" y="102" class="label">All-time contributions</text><text x="316" y="102" text-anchor="end" class="value">21,512</text>
<circle cx="27" cy="120" r="3" fill="#7ee787" /><text x="38" y="124" class="label">Lines changed</text><text x="316" y="124" text-anchor="end" class="value">8,916,911</text>
<circle cx="27" cy="142" r="3" fill="#f78166" /><text x="38" y="146" class="label">Views, past 14 days</text><text x="316" y="146" text-anchor="end" class="value">5,455</text>
<circle cx="27" cy="164" r="3" fill="#7ee787" /><text x="38" y="168" class="label">Repositories touched</text><text x="316" y="168" text-anchor="end" class="value">200</text>
</svg>
