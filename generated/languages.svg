<svg width="360" height="320" viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Authored language changes over 90 days</title>
<desc>Added and deleted lines in non-merge commits authored by the configured GitHub user, committed during the stated 90 complete UTC days. Includes upstream repositories and owned or known contributed forks irrespective of COUNT_STATS_FROM_FORKS. Discovery covers GitHub search-indexed default branches plus default branches of forks found through owned/contributed repository listings accessible to the token; undiscoverable repositories and non-default branches may be absent. GitHub search considers at most 4,000 repositories per query. Identical commit SHAs count once. Language detection uses pinned GitHub Linguist filenames and content rules. If the diff is inconclusive, the repository&#x27;s language list can resolve a filename only when one candidate matches. Percentages count changed lines, not repository sizes. Unresolved filenames are classified as Unclassified.</desc>
<style>
  @media (prefers-color-scheme: light) {
    svg {
      --card-background: #ffffff;
      --card-border: #d1d9e0;
      --card-title: #1f2328;
      --card-text: #1f2328;
      --card-muted: #59636e;
      --card-accent: #bc4c00;
      --card-track: #eff2f5;
    }
  }
  .card { fill: var(--card-background, #0d1117); stroke: var(--card-border, #30363d); }
  .divider { stroke: var(--card-border, #30363d); }
  text {
    font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif;
    letter-spacing: 0;
  }
  .title { fill: var(--card-title, #f0f6fc); font-size: 16px; font-weight: 700; }
  .label { fill: var(--card-text, #c9d1d9); font-size: 13px; font-weight: 500; }
  .value { fill: var(--card-text, #c9d1d9); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .caption { fill: var(--card-muted, #8b949e); font-size: 11px; }
</style>
