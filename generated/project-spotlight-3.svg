<svg width="330" height="520" viewBox="0 0 330 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Nyx project spotlight card</title>
<defs>
  <linearGradient id="card-face" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#201914"/>
    <stop offset="48%" stop-color="#111018"/>
    <stop offset="100%" stop-color="#08070b"/>
  </linearGradient>
  <radialGradient id="halo" cx="50%" cy="35%" r="58%">
    <stop offset="0%" stop-color="#d7b46a" stop-opacity="0.24"/>
    <stop offset="46%" stop-color="#7f4f3a" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#08070b" stop-opacity="0"/>
  </radialGradient>
  <pattern id="fine-lines" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <path d="M0 0 H12" stroke="#47352c" stroke-opacity="0.28" stroke-width="1"/>
  </pattern>
</defs>
<style>
  text {
    font-family: Georgia, Cambria, "Times New Roman", serif;
    letter-spacing: 0;
  }
  .numeral { fill: #d7b46a; font-size: 15px; font-weight: 800; }
  .arcana { fill: #d7b46a; font-size: 12px; font-weight: 800; text-transform: uppercase; }
  .title { fill: #f5efe3; font-size: 32px; font-weight: 850; }
  .suit { fill: #b8aa92; font-size: 13px; font-weight: 750; }
  .body { fill: #ded3bf; font-size: 14px; }
  .rule { stroke: #5a4437; stroke-width: 1.25; }
  .card-bg { fill: #111018; }
  .halo-ring { fill: none; stroke: #5a4437; stroke-width: 1; }
  .moon { fill: #d7b46a; opacity: 0.9; }
  .spark { fill: none; stroke: #9b5c42; stroke-width: 1.4; stroke-linecap: round; }
  .seal { fill: rgba(215, 180, 106, 0.08); stroke: #5a4437; stroke-width: 1.1; }
  .emblem { fill: none; stroke: #d7b46a; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
  .emblem-thin { fill: none; stroke: #d7b46a; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
  .emblem-fill { fill: rgba(215, 180, 106, 0.12); stroke: #d7b46a; stroke-width: 1.7; stroke-linejoin: round; }
  .emblem-dark { fill: #151017; stroke: #d7b46a; stroke-width: 1.7; stroke-linejoin: round; }
  .emblem-blue { fill: none; stroke: #6f8396; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .emblem-warm { fill: #9b5c42; stroke: none; }
  .ornament { fill: none; stroke: #d7b46a; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; opacity: 0.72; }
  .ornament circle { fill: #d7b46a; stroke: none; opacity: 0.72; }
  .wear { fill: none; stroke: #c8ad75; stroke-width: 0.8; stroke-linecap: round; opacity: 0.18; }
  .wear circle { fill: #c8ad75; stroke: none; opacity: 0.16; }
</style>
<rect x="10" y="10" width="310" height="500" rx="22" fill="#05070b"/>
<rect x="15" y="15" width="300" height="490" rx="18" fill="url(#card-face)" stroke="#4d3a30" stroke-width="2"/>
<rect x="29" y="29" width="272" height="462" rx="13" fill="url(#fine-lines)" opacity="0.5"/>
<rect x="29" y="29" width="272" height="462" rx="13" fill="none" stroke="#342b28"/>
<rect x="43" y="43" width="244" height="434" rx="8" fill="none" stroke="#d7b46a" stroke-opacity="0.65"/>

<g class="ornament">
  <path d="M55 76 L69 76 M55 76 L55 90 M275 76 L261 76 M275 76 L275 90"/>
  <path d="M53 467 L65 467 M53 467 L53 455 M277 467 L265 467 M277 467 L277 455"/>
  <path d="M143 120 L165 108 L187 120 L165 132 Z"/>
  <path d="M61 105 C74 98 88 98 101 105 M269 105 C256 98 242 98 229 105"/>
  <path d="M131 445 L165 424 L199 445 L165 466 Z"/>
  <path d="M60 447 L81 434 L102 447 L81 460 Z"/>
  <path d="M228 447 L249 434 L270 447 L249 460 Z"/>
  <path d="M73 408 C91 419 110 419 128 408 M257 408 C239 419 220 419 202 408"/>
  <path d="M72 438 H124 M206 438 H258 M72 464 H124 M206 464 H258"/>
  <path d="M57 198 V212 M273 198 V212 M57 308 V322 M273 308 V322"/>
  <circle cx="58" cy="235" r="1.7"/><circle cx="272" cy="235" r="1.7"/>
  <circle cx="58" cy="285" r="1.7"/><circle cx="272" cy="285" r="1.7"/>
</g>
<g class="wear">
  <path d="M38 84 C61 79 74 82 92 76"/>
  <path d="M236 48 C252 51 268 49 286 56"/>
  <path d="M44 381 C65 388 89 385 104 394"/>
  <path d="M226 461 C244 454 262 456 286 448"/>
  <circle cx="87" cy="273" r="1.3"/>
  <circle cx="244" cy="285" r="1.1"/>
  <circle cx="103" cy="428" r="1.2"/>
  <circle cx="267" cy="350" r="1"/>
</g>

<circle cx="165" cy="178" r="96" fill="url(#halo)"/>
<text x="165" y="64" class="numeral" text-anchor="middle">XVII</text>
<text x="165" y="91" class="arcana" text-anchor="middle">The Declarative Star</text>

<circle class="halo-ring" cx="165" cy="178" r="76"/>
<circle class="seal" cx="165" cy="178" r="62"/>
<path class="emblem-thin" d="M93 260 H237"/>
<g transform="translate(85 98)">
<path class="emblem-fill" d="M80 20 L91 61 H133 L99 85 L112 126 L80 101 L48 126 L61 85 L27 61 H69 Z"/>
<path class="emblem" d="M80 20 V132 M27 61 H133 M45 132 L80 101 L115 132"/>
<path class="emblem-blue" d="M37 124 C58 107 102 107 123 124"/>
<circle class="emblem-warm" cx="80" cy="80" r="7"/>
</g>

<text x="165" y="294" class="title" text-anchor="middle" style="font-size: 32px">Nyx</text>
<text x="165" y="320" class="suit" text-anchor="middle">Nix / reversed</text>
<line x1="72" y1="340" x2="258" y2="340" class="rule"/>
<text x="165" y="358" class="body" text-anchor="middle">the first child of Chaos and</text>
<text x="165" y="378" class="body" text-anchor="middle">also an alias for my</text>
<text x="165" y="398" class="body" text-anchor="middle">configuration for the ultimate</text>
<text x="165" y="418" class="body" text-anchor="middle">declarative Linux distro,...</text>
</svg>
