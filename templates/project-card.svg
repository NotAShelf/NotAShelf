<svg width="{{ WIDTH }}" height="{{ HEIGHT }}" viewBox="0 0 330 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="card-title card-description">
<title id="card-title">{{ NUMERAL }}. {{ ARCANA }}: {{ TITLE }}</title>
<desc id="card-description">{{ ACCESSIBLE_DESCRIPTION }}. Artwork from scanned Gustave Doré Inferno engravings, first published in 1861.</desc>
<defs>
  <pattern id="paper-grain" width="47" height="53" patternUnits="userSpaceOnUse">
    <path d="M2 5 h8 M27 18 h3 M8 41 h5 M35 48 h9 M41 30 h2" stroke="var(--ink)" stroke-width="0.4" opacity="0.09"/>
  </pattern>
</defs>
<style>
  :root { --paper: #141713; --edge: #090c0a; --ink: #ded6c3; --muted: #b7b09e; --rule: #9f9987; --faint: #565c50; }
  @media (prefers-color-scheme: light) {
    :root { --paper: #f5eedf; --edge: #dfd4be; --ink: #29271f; --muted: #645b4b; --rule: #8c7c60; --faint: #cbbd9f; }
  }
  text { font-family: Georgia, "Times New Roman", serif; fill: var(--ink); }
  .numeral { font-size: 21px; letter-spacing: 2px; }
  .arcana { font-size: 17px; letter-spacing: 1px; font-variant: small-caps; }
  .title { font-weight: bold; }
  .suit { font-size: 13px; font-style: italic; fill: var(--muted); }
  .body { fill: var(--muted); }
  .rule { fill: none; stroke: var(--rule); stroke-width: 0.7; }
  .scrollwork { fill: none; stroke: var(--rule); stroke-width: 0.7; stroke-linecap: round; }
</style>
<rect x="3" y="3" width="324" height="554" rx="10" fill="var(--edge)"/>
<rect x="9" y="9" width="312" height="542" rx="6" fill="var(--paper)" stroke="var(--rule)" stroke-width="0.8"/>
<rect x="16" y="16" width="298" height="528" rx="3" fill="url(#paper-grain)" stroke="var(--faint)" stroke-width="0.5"/>
{{ ORNAMENTS }}
<path d="M49 47 H124 M206 47 H281 M56 51 H121 M209 51 H274" class="rule"/>
<ellipse cx="165" cy="43" rx="31" ry="18" fill="var(--paper)" stroke="var(--rule)" stroke-width="0.7"/>
<text x="165" y="50" class="numeral" text-anchor="middle">{{ NUMERAL }}</text>
<path d="M33 71 H297 V357 H33 Z M29 67 H301 V361 H29 Z" class="rule"/>
{{ SCENE }}
<path d="M39 369 H291 L297 375 V403 L291 409 H39 L33 403 V375 Z" fill="var(--paper)" stroke="var(--rule)" stroke-width="0.8"/>
<text x="165" y="395" class="arcana" text-anchor="middle">{{ ARCANA }}</text>
<text x="165" y="439" class="title" text-anchor="middle" font-size="{{ PROJECT_TITLE_SIZE }}">{{ PROJECT_TITLE }}</text>
<text x="165" y="460" class="suit" text-anchor="middle">{{ SUIT }}</text>
{{ DESCRIPTION }}
<path d="M125 546 H153 M177 546 H205 M160 546 l5 -4 l5 4 l-5 4 Z" class="rule"/>
</svg>
